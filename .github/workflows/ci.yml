      - run: bash .github/ci/run-containerized-test.sh
      - name: Upload test results and AEM logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: selenium-chrome-cloudready-with-addon-reports
          if-no-files-found: ignore
          path: |
