# Mirrors CircleCI workflow "build-and-release" (.circleci/config.yml)
#
# Required GitHub secrets (from CircleCI context "CIF Artifactory Cloud"):
#   ARTIFACTORY_CLOUD_USER, ARTIFACTORY_CLOUD_PASS
#   COMMERCE_ENDPOINT, COMMERCE_INTEGRATION_TOKEN
#   VENIA_ACCOUNT_EMAIL, VENIA_ACCOUNT_PASSWORD
# Optional: CODECOV_TOKEN

name: ci

on:
  pull_request:
  push:
    tags:
      - '**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACTORY_CLOUD_USER: ${{ secrets.ARTIFACTORY_CLOUD_USER }}
  ARTIFACTORY_CLOUD_PASS: ${{ secrets.ARTIFACTORY_CLOUD_PASS }}
  COMMERCE_ENDPOINT: ${{ secrets.COMMERCE_ENDPOINT }}
  COMMERCE_INTEGRATION_TOKEN: ${{ secrets.COMMERCE_INTEGRATION_TOKEN }}
  VENIA_ACCOUNT_EMAIL: ${{ secrets.VENIA_ACCOUNT_EMAIL }}
  VENIA_ACCOUNT_PASSWORD: ${{ secrets.VENIA_ACCOUNT_PASSWORD }}

jobs:
  build:
    name: build
    # CircleCI executor: cif_executor (cimg/openjdk:11.0-browsers)
    runs-on: ubuntu-latest
    container:
      image: cimg/openjdk:11.0-browsers
      options: --user circleci
    steps:
      - uses: actions/checkout@v4

      # CircleCI: node/install node-version 12.14.1 (nvm inside cimg)
      - name: Install Node.js 12.14.1
        run: |
          export NVM_DIR="/opt/circleci/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          nvm install 12.14.1
          nvm use 12.14.1
          node -v
          npm -v

      # CircleCI: restore_cache on ~/.m2 BEFORE install_components
      - name: Restore Maven repository cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2
          key: maven-repo-v2-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-repo-v2-${{ runner.os }}-${{ github.ref_name }}-
            maven-repo-v2-${{ runner.os }}-
            maven-repo-v2-

      - name: Update permissions
        run: sudo chown -R circleci /usr/local/lib/node_modules || true

      - name: Install CIF Components
        run: bash .github/ci/install-cif-components.sh

      - name: Build
        run: |
          export NVM_DIR="/opt/circleci/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          nvm use 12.14.1
          java -version
          mvn -v
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BRANCH_NAME="${GITHUB_HEAD_REF}"
          elif [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            BRANCH_NAME="${GITHUB_REF_NAME}"
          else
            BRANCH_NAME=""
          fi
          if [[ -n "${BRANCH_NAME}" && "${BRANCH_NAME}" != "main" ]]; then
            mvn -B clean install -PfedDev,classic
          else
            mvn -B clean install -Pclassic
          fi

      - name: Run Unit Tests (Jest)
        working-directory: ui.frontend
        run: |
          export NVM_DIR="/opt/circleci/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
          nvm use 12.14.1
          npm run ci

      - name: Save Maven repository cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.m2
          key: maven-repo-v2-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/pom.xml') }}

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          if-no-files-found: warn
          path: |
            all/target/*.zip
            classic/all/target/*.zip
            dependencies/aem-core-cif-components/examples/bundle/target/*.jar

  integration-test-655:
    name: integration-test-655
    needs: build
    runs-on: ubuntu-latest
    env:
      AEM: classic
      TYPE: integration
      CI_QP_PATH: /home/circleci/cq
    steps:
      - uses: actions/checkout@v4
      - name: Restore Maven repository cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2
          key: maven-repo-v2-its-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-repo-v2-its-${{ runner.os }}-${{ github.ref_name }}-
            maven-repo-v2-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/pom.xml') }}
            maven-repo-v2-${{ runner.os }}-${{ github.ref_name }}-
            maven-repo-v2-${{ runner.os }}-
            maven-repo-v2-
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      - run: bash .github/ci/run-it-in-docker.sh docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-qp:6.4.6-openjdk11 docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-aem:6.5.23.0-openjdk11
      - name: Save Maven repository cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.m2
          key: maven-repo-v2-its-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/pom.xml') }}
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-655-reports
          if-no-files-found: ignore
          path: test-reports
      - name: Upload AEM logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-655-logs
          if-no-files-found: ignore
          path: logs

