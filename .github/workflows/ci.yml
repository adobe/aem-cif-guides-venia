# Mirrors CircleCI workflow "build-and-release" (.circleci/config.yml)
#
# Required GitHub secrets (from CircleCI context "CIF Artifactory Cloud"):
#   ARTIFACTORY_CLOUD_USER, ARTIFACTORY_CLOUD_PASS
#   COMMERCE_ENDPOINT, COMMERCE_INTEGRATION_TOKEN
#   VENIA_ACCOUNT_EMAIL, VENIA_ACCOUNT_PASSWORD
# Optional: CODECOV_TOKEN

name: ci

on:
  pull_request:
  push:
    tags:
      - '**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACTORY_CLOUD_USER: ${{ secrets.ARTIFACTORY_CLOUD_USER }}
  ARTIFACTORY_CLOUD_PASS: ${{ secrets.ARTIFACTORY_CLOUD_PASS }}
  COMMERCE_ENDPOINT: ${{ secrets.COMMERCE_ENDPOINT }}
  COMMERCE_INTEGRATION_TOKEN: ${{ secrets.COMMERCE_INTEGRATION_TOKEN }}
  VENIA_ACCOUNT_EMAIL: ${{ secrets.VENIA_ACCOUNT_EMAIL }}
  VENIA_ACCOUNT_PASSWORD: ${{ secrets.VENIA_ACCOUNT_PASSWORD }}

jobs:
  build:
    name: build
    # CircleCI executor: cif_executor (cimg/openjdk:11.0-browsers) — not ubuntu + Temurin.
    runs-on: ubuntu-latest
    container:
      image: cimg/openjdk:11.0-browsers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '12.14.1'

      # CircleCI: restore_cache on ~/.m2 BEFORE install_components (fallback key maven-repo-v2-).
      - name: Restore Maven repository cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2
          key: maven-repo-v2-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-repo-v2-${{ runner.os }}-${{ github.ref_name }}-
            maven-repo-v2-${{ runner.os }}-
            maven-repo-v2-

      - name: Update permissions
        run: sudo chown -R "$(whoami)" /usr/local/lib/node_modules || true

      # CircleCI build job does NOT configure ~/.m2/settings.xml or -Partifactory-cloud here.
      # Artifactory settings are only used in it-tests.js (-s .circleci/settings.xml -Partifactory-cloud).

      - name: Install CIF Components
        run: bash .github/ci/install-cif-components.sh

      - name: Upload CIF unit test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cif-surefire-reports
          if-no-files-found: ignore
          path: dependencies/aem-core-cif-components/**/target/surefire-reports/

      - name: Build
        run: |
          java -version
          mvn -v
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BRANCH_NAME="${GITHUB_HEAD_REF}"
          elif [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            BRANCH_NAME="${GITHUB_REF_NAME}"
          else
            BRANCH_NAME=""
          fi
          if [[ -n "${BRANCH_NAME}" && "${BRANCH_NAME}" != "main" ]]; then
            mvn -B clean install -PfedDev,classic
          else
            mvn -B clean install -Pclassic
          fi

      - name: Run Unit Tests (Jest)
        working-directory: ui.frontend
        run: npm run ci

      # CircleCI: save_cache on ~/.m2 after build (same key family as restore).
      - name: Save Maven repository cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.m2
          key: maven-repo-v2-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/pom.xml') }}

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          if-no-files-found: warn
          path: |
            all/target/*.zip
            classic/all/target/*.zip
            dependencies/aem-core-cif-components/examples/bundle/target/*.jar

  # NOTE on the jobs below: they intentionally do NOT use GitHub Actions' `container:` +
  # `services:` keys. The QuickProvider RMI protocol used by run-integration-test.sh
  # requires the qp client and the AEM server to share the same network namespace
  # (traffic is routed back through "localhost", exactly like CircleCI's machine
  # executor). That means both containers need `--network host`, but the GitHub
  # Actions runner has a bug where combining `--network host` with a `services:`
  # container crashes the job before it even starts ("Error: Value cannot be null.
  # (Parameter 'ContainerId')"). Instead, these jobs run directly on the bare runner
  # and manually `docker run --network host` both images via run-containerized-test.sh,
  # which sidesteps the runner's service-container orchestration entirely.

  integration-test-655:
    name: integration-test-655
    needs: build
    runs-on: ubuntu-latest
    env:
      AEM: classic
      TYPE: integration
      CI_QP_PATH: /home/circleci/cq
      QP_SERVER_HOSTNAME: localhost
      AEM_LOG_HOST: localhost
      QP_IMAGE: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-qp:6.4.6-openjdk11
      AEM_IMAGE: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-aem:6.5.23.0-openjdk11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      - run: bash .github/ci/run-containerized-test.sh
      - name: Upload test results and AEM logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-655-reports
          if-no-files-found: ignore
          path: |
            test-reports
            logs

  integration-test-660:
    name: integration-test-660
    needs: build
    runs-on: ubuntu-latest
    env:
      AEM: lts
      TYPE: integration
      CI_QP_PATH: /home/circleci/cq
      QP_SERVER_HOSTNAME: localhost
      AEM_LOG_HOST: localhost
      QP_IMAGE: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-qp:6.4.7-openjdk21
      AEM_IMAGE: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-aem-lts:6.6.0-openjdk21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      - run: bash .github/ci/run-containerized-test.sh
      - name: Upload test results and AEM logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-660-reports
          if-no-files-found: ignore
          path: |
            test-reports
            logs

  integration-test-cloudready-with-addon:
    name: integration-test-cloudready-with-addon
    needs: build
    runs-on: ubuntu-latest
    env:
      AEM: cloud
      TYPE: integration
      CI_QP_PATH: /home/circleci/cq
      QP_SERVER_HOSTNAME: localhost
      AEM_LOG_HOST: localhost
      QP_IMAGE: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-qp:6.4.7-openjdk21
      AEM_IMAGE: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-aem-cloudready:25194-openjdk21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      - run: bash .github/ci/run-containerized-test.sh
      - name: Upload test results and AEM logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-cloudready-with-addon-reports
          if-no-files-found: ignore
          path: |
            test-reports
            logs

  selenium-chrome-655:
    name: selenium-chrome-655
    needs: build
    runs-on: ubuntu-latest
    env:
      AEM: classic
      TYPE: selenium
      BROWSER: chrome
      CI_QP_PATH: /home/circleci/cq
      QP_SERVER_HOSTNAME: localhost
      AEM_LOG_HOST: localhost
      QP_IMAGE: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-qp:6.4.6-openjdk11
      AEM_IMAGE: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-aem:6.5.23.0-openjdk11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      - run: bash .github/ci/run-containerized-test.sh
      - name: Upload test results and AEM logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: selenium-chrome-655-reports
          if-no-files-found: ignore
          path: |
            test-reports
            logs

  selenium-chrome-660:
    name: selenium-chrome-660
    needs: build
    runs-on: ubuntu-latest
    env:
      AEM: lts
      TYPE: selenium
      BROWSER: chrome
      CI_QP_PATH: /home/circleci/cq
      QP_SERVER_HOSTNAME: localhost
      AEM_LOG_HOST: localhost
      QP_IMAGE: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-qp:6.4.7-openjdk21
      AEM_IMAGE: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-aem-lts:6.6.0-openjdk21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      - run: bash .github/ci/run-containerized-test.sh
      - name: Upload test results and AEM logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: selenium-chrome-660-reports
          if-no-files-found: ignore
          path: |
            test-reports
            logs

  selenium-chrome-cloudready-with-addon:
    name: selenium-chrome-cloudready-with-addon
    needs: build
    runs-on: ubuntu-latest
    env:
      AEM: cloud
      TYPE: selenium
      BROWSER: chrome
      CI_QP_PATH: /home/circleci/cq
      QP_SERVER_HOSTNAME: localhost
      AEM_LOG_HOST: localhost
      QP_IMAGE: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-qp:6.4.7-openjdk21
      AEM_IMAGE: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-aem-cloudready:25194-openjdk21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
