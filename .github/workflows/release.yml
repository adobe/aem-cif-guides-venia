# Release workflow — gated by the "release" GitHub Environment.
# Create Environment: Settings → Environments → release
#
# Tag filter matches CircleCI: ^venia(-classic)?-\d+\.\d+\.\d+$

name: release

on:
  push:
    tags:
      # 'venia-*' already covers 'venia-classic-*' (both start with 'venia-').
      - 'venia-*'

permissions:
  contents: write
  checks: write

env:
  ARTIFACTORY_CLOUD_USER: ${{ secrets.ARTIFACTORY_CLOUD_USER }}
  ARTIFACTORY_CLOUD_PASS: ${{ secrets.ARTIFACTORY_CLOUD_PASS }}

jobs:
  deploy-sample:
    name: deploy-sample
    runs-on: ubuntu-latest
    environment: release
    env:
      CI_REPO_PATH: ${{ github.workspace }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Import GPG key
        run: echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Deploy to Maven Central and build release packages
        run: bash .github/ci/deploy-maven-release.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true

      # If the release build (mvn clean deploy) fails on a test, publish a "Tests" check
      # with the failed tests + error/stack trace — same tool/style as the ci workflow.
      - name: Publish test results
        if: failure()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Tests (release)
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          skip_success_summary: true
          annotate_only: true
          fail_on_failure: false

  update-cm:
    name: update-cm
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Update Cloud Manager repository
        run: bash .github/ci/update-cm.sh
        env:
          GIT_REPO: ${{ secrets.GIT_REPO }}
          GIT_USER: ${{ secrets.GIT_USER }}
          GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
