# Release workflow — triggered by version tags.
#
# Tag filter: ^venia(-classic)?-\d+\.\d+\.\d+$

name: release

on:
  push:
    tags:
      # 'venia-*' already covers 'venia-classic-*' (both start with 'venia-').
      - 'venia-*'

permissions:
  contents: write
  checks: write

env:
  ARTIFACTORY_CLOUD_USER: ${{ secrets.ARTIFACTORY_CLOUD_USER }}
  ARTIFACTORY_CLOUD_PASS: ${{ secrets.ARTIFACTORY_CLOUD_PASS }}

jobs:
  deploy-sample:
    name: deploy-sample
    runs-on: ubuntu-latest
    env:
      CI_REPO_PATH: ${{ github.workspace }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Import GPG key
        run: echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Deploy to Maven Central and build release packages
        run: bash .github/ci/deploy-venia.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true

      # If the release build (mvn clean deploy) fails on a test, publish a "Tests" check
      # with the failed tests + error/stack trace — same tool/style as the ci workflow.
      - name: Publish test results
        if: failure()
        uses: mikepenz/action-junit-report@v5
        with:
          check_name: Tests (release)
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          skip_success_summary: true
          annotate_only: true
          fail_on_failure: false

  update-cm:
    name: update-cm
    # Only advance the Cloud Manager 'main' branch after the Maven Central deploy + release
    # packaging succeeded. Without this, update-cm runs concurrently with deploy-sample and
    # would push the tag to Cloud Manager even when the release build failed.
    needs: deploy-sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Update Cloud Manager repository
        # update-cm.js already sets fetch.negotiationAlgorithm=noop per-command on the one
        # fetch that needs it (the Azure DevOps git fetch workaround), so no global config here.
        run: node .github/ci/update-cm.js
        env:
          GIT_REPO: ${{ secrets.GIT_REPO }}
          GIT_USER: ${{ secrets.GIT_USER }}
          GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
