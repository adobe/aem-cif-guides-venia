name: release

# Separate workflow so release jobs never appear as skipped checks on PRs.
on:
  push:
    tags:
      - 'venia-*'
      - 'venia-classic-*'

env:
  ARTIFACTORY_CLOUD_USER: ${{ secrets.ARTIFACTORY_CLOUD_USER }}
  ARTIFACTORY_CLOUD_PASS: ${{ secrets.ARTIFACTORY_CLOUD_PASS }}

jobs:
  deploy-sample:
    name: deploy-sample
    runs-on: ubuntu-latest
    env:
      CI_REPO_PATH: ${{ github.workspace }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Import GPG key
        run: echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Deploy Venia Sample Project
        run: node .circleci/ci/deploy-venia.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup credentials
        if: always()
        run: |
          rm -rf ~/.gnupg
          rm -rf ~/.npmrc

  update-cm:
    name: update-cm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update CM Repository
        run: node .circleci/ci/update-cm.js
        env:
          GIT_REPO: ${{ secrets.GIT_REPO }}
          GIT_USER: ${{ secrets.GIT_USER }}
          GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
