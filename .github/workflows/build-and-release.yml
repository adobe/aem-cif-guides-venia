name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'

concurrency:
  group: build-and-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACTORY_CLOUD_USER: ${{ secrets.ARTIFACTORY_CLOUD_USER }}
  ARTIFACTORY_CLOUD_PASS: ${{ secrets.ARTIFACTORY_CLOUD_PASS }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Set up Node.js 12.14.1
        uses: actions/setup-node@v4
        with:
          node-version: '12.14.1'

      - name: Install CIF Components
        run: bash .github/ci/install-cif-components.sh

      - name: Build
        run: |
          java -version
          mvn -v
          if [[ "${{ github.ref_name }}" != "" && "${{ github.ref_name }}" != "main" ]]; then
            mvn -B clean install -PfedDev,classic
          else
            mvn -B clean install -Pclassic
          fi

      - name: Run Unit Tests (Jest)
        working-directory: ui.frontend
        run: npm run ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          if-no-files-found: warn
          path: |
            all/target/*.zip
            classic/all/target/*.zip
            dependencies/aem-core-cif-components/examples/bundle/target/*.jar

      - name: Upload Java unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-unit-test-results
          if-no-files-found: ignore
          path: core/target/surefire-reports

      - name: Upload frontend unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-test-results
          if-no-files-found: ignore
          path: ui.frontend/test-results

      - name: Publish Java unit test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: core/target/surefire-reports/**/*.xml
          check_name: Java Unit Test Results

      - name: Publish frontend unit test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ui.frontend/test-results/**/*.xml
          check_name: Frontend Unit Test Results

  integration-test-655:
    name: Integration Test (AEM 6.5)
    needs: build
    uses: ./.github/workflows/integration-test-reusable.yml
    secrets: inherit
    with:
      job_name: Integration Test (AEM 6.5)
      aem: classic
      type: integration
      qp_image: circleci-qp:6.4.6-openjdk11
      aem_image: circleci-aem:6.5.23.0-openjdk11

  integration-test-660:
    name: Integration Test (AEM 6.5 LTS)
    needs: build
    uses: ./.github/workflows/integration-test-reusable.yml
    secrets: inherit
    with:
      job_name: Integration Test (AEM 6.5 LTS)
      aem: lts
      type: integration
      qp_image: circleci-qp:6.4.7-openjdk21
      aem_image: circleci-aem-lts:6.6.0-openjdk21

  integration-test-cloudready-with-addon:
    name: Integration Test (Cloud)
    needs: build
    uses: ./.github/workflows/integration-test-reusable.yml
    secrets: inherit
    with:
      job_name: Integration Test (Cloud)
      aem: cloud
      type: integration
      qp_image: circleci-qp:6.4.7-openjdk21
      aem_image: circleci-aem-cloudready:25194-openjdk21

  selenium-chrome-cloudready-with-addon:
    name: Selenium Chrome (Cloud)
    needs: build
    uses: ./.github/workflows/integration-test-reusable.yml
    secrets: inherit
    with:
      job_name: Selenium Chrome (Cloud)
      aem: cloud
      type: selenium
      browser: chrome
      qp_image: circleci-qp:6.4.7-openjdk21
      aem_image: circleci-aem-cloudready:25194-openjdk21

  selenium-chrome-655:
    name: Selenium Chrome (AEM 6.5)
    needs: build
    uses: ./.github/workflows/integration-test-reusable.yml
    secrets: inherit
    with:
      job_name: Selenium Chrome (AEM 6.5)
      aem: classic
      type: selenium
      browser: chrome
      qp_image: circleci-qp:6.4.6-openjdk11
      aem_image: circleci-aem:6.5.23.0-openjdk11

  selenium-chrome-660:
    name: Selenium Chrome (AEM 6.5 LTS)
    needs: build
    uses: ./.github/workflows/integration-test-reusable.yml
    secrets: inherit
    with:
      job_name: Selenium Chrome (AEM 6.5 LTS)
      aem: lts
      type: selenium
      browser: chrome
      qp_image: circleci-qp:6.4.7-openjdk21
      aem_image: circleci-aem-lts:6.6.0-openjdk21

  deploy-sample:
    name: Deploy Venia Sample Project
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/venia')
    runs-on: ubuntu-latest
    env:
      CI_REPO_PATH: ${{ github.workspace }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Import GPG key
        run: echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Deploy Venia Sample Project
        run: node .circleci/ci/deploy-venia.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup credentials
        if: always()
        run: |
          rm -rf ~/.gnupg
          rm -rf ~/.npmrc

  update-cm:
    name: Update Cloud Manager Repository
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/venia')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update CM Repository
        run: node .circleci/ci/update-cm.js
        env:
          GIT_REPO: ${{ secrets.GIT_REPO }}
          GIT_USER: ${{ secrets.GIT_USER }}
          GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
