name: build-and-release

# Mirror CircleCI: one run per push; PRs use pull_request only to avoid duplicate checks.
on:
  pull_request:
  push:
    tags:
      - '**'

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACTORY_CLOUD_USER: ${{ secrets.ARTIFACTORY_CLOUD_USER }}
  ARTIFACTORY_CLOUD_PASS: ${{ secrets.ARTIFACTORY_CLOUD_PASS }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '12.14.1'

      - name: Update permissions
        run: sudo chown -R "$(whoami)" /usr/local/lib/node_modules || true

      - name: Install CIF Components
        run: bash .github/ci/install-cif-components.sh

      - name: Build
        run: |
          java -version
          mvn -v
          if [[ "${USE_FED_DEV:-false}" == "true" ]]; then
            mvn -B clean install -PfedDev,classic
          else
            mvn -B clean install -Pclassic
          fi

      - name: Run Unit Tests (Jest)
        working-directory: ui.frontend
        run: npm run ci

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
          fail_ci_if_error: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          if-no-files-found: warn
          path: |
            all/target/*.zip
            classic/all/target/*.zip
            dependencies/aem-core-cif-components/examples/bundle/target/*.jar

  integration-test-655:
    name: integration-test-655
    needs: build
    runs-on: ubuntu-latest
    container:
      image: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-qp:6.4.6-openjdk11
      credentials:
        username: ${{ secrets.ARTIFACTORY_CLOUD_USER }}
        password: ${{ secrets.ARTIFACTORY_CLOUD_PASS }}
    services:
      aem:
        image: docker-adobe-cif-release.dr-uw2.adobeitc.com/circleci-aem:6.5.23.0-openjdk11
        credentials:
          username: ${{ secrets.ARTIFACTORY_CLOUD_USER }}
          password: ${{ secrets.ARTIFACTORY_CLOUD_PASS }}
    env:
      AEM: classic
      TYPE: integration
      CI_QP_PATH: /home/circleci/cq
      QP_SERVER_HOSTNAME: aem
      COMMERCE_ENDPOINT: ${{ secrets.COMMERCE_ENDPOINT }}
      COMMERCE_INTEGRATION_TOKEN: ${{ secrets.COMMERCE_INTEGRATION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "CI_BUILD_PATH=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
      - uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .
      - run: bash .github/ci/run-integration-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-integration-test-655
          if-no-files-found: ignore
          path: |
            test-reports
            logs

