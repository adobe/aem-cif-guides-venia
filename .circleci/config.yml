version: 2.1

# Debug: run update-cm against Azure branch issue-update-cm-debug (not main).
# Restore full config from main when done.

executors:
  cif_executor:
    docker:
      - image: cimg/openjdk:11.0-browsers

jobs:
  update-cm-debug:
    executor: cif_executor
    working_directory: ~/repo
    environment:
      CM_TARGET_BRANCH: issue-update-cm-debug
    steps:
      - checkout
      - run:
          name: Sync to Azure CM (debug branch)
          command: node .circleci/ci/update-cm.js

workflows:
  cm-update-debug:
    jobs:
      - update-cm-debug:
          context:
            - CIF Artifactory Cloud
            - CIF CM Stage
          filters:
            branches:
              only: /^issue-update-cm-debug$/
