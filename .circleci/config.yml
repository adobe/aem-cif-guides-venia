version: 2.1

# Temporary config: downstream CM Git connection check only.
# Restore full config from main when debugging is done.

executors:
  cif_executor:
    docker:
      - image: cimg/openjdk:11.0-browsers

jobs:
  update-cm-connection-debug:
    executor: cif_executor
    working_directory: ~/repo
    steps:
      - checkout
      - run:
          name: Verify downstream CM Git connection
          command: |
            set -euo pipefail

            log() { echo ""; echo "--- $1 ---"; echo ""; }

            log "environment"
            echo "CIRCLE_BRANCH=${CIRCLE_BRANCH:-unset}"
            echo "CIRCLE_SHA1=${CIRCLE_SHA1:-unset}"
            echo "GIT_REPO=${GIT_REPO:+set}"
            echo "GIT_USER=${GIT_USER:+set}"
            echo "GIT_PASSWORD=${GIT_PASSWORD:+set}"

            if [[ -z "${GIT_REPO:-}" || -z "${GIT_USER:-}" || -z "${GIT_PASSWORD:-}" ]]; then
              echo "ERROR: GIT_REPO, GIT_USER, and GIT_PASSWORD must be set (CIF CM Stage context)."
              exit 1
            fi

            log "local git state"
            git --version
            git remote -v
            git config -l | grep -iE 'partial|promisor|filter|recurse|depth' || echo "(no partial/promisor config)"

            log "configure credentials"
            git config --local user.name "CircleCI Builds"
            git config --local user.email "builds@circleci.com"
            git config credential.helper '!f() { sleep 1; echo "username=${GIT_USER}"; echo "password=${GIT_PASSWORD}"; }; f'

            cleanup() {
              git config --unset credential.helper || true
              git config --local --unset user.name || true
              git config --local --unset user.email || true
            }
            trap cleanup EXIT

            log "add downstream remote"
            if git remote get-url downstream &>/dev/null; then
              echo "downstream remote already exists"
              git remote get-url downstream
            else
              git remote add downstream "${GIT_REPO}"
            fi

            log "connection test (ls-remote)"
            echo "Listing refs on downstream (auth + reachability, no object fetch)..."
            git ls-remote downstream HEAD refs/heads/main

            log "clear promisor config before fetch probe"
            git config --unset-all remote.origin.promisor 2>/dev/null || true
            git config --unset-all extensions.partialClone 2>/dev/null || true
            git config --unset-all remote.origin.partialclonefilter 2>/dev/null || true

            log "fetch probe (same ref update-cm uses)"
            TARGET_BRANCH=main
            REFSPEC="+refs/heads/${TARGET_BRANCH}:refs/remotes/downstream/${TARGET_BRANCH}"
            echo "Running: git fetch downstream ${REFSPEC} --no-tags --prune"
            export GIT_TRACE=1 GIT_TRACE_PACKET=1 GIT_CURL_VERBOSE=1
            git fetch downstream "${REFSPEC}" --no-tags --prune

            log "success"
            echo "Downstream connection OK: ls-remote and fetch of refs/heads/${TARGET_BRANCH} succeeded."

workflows:
  cm-update-debug:
    jobs:
      - update-cm-connection-debug:
          context:
            - CIF Artifactory Cloud
            - CIF CM Stage
          filters:
            branches:
              only: /^issue-update-cm$/
